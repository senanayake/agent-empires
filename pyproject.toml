[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-empires"
version = "0.1.0"
description = "Deterministic headless organization simulation primitives"
requires-python = "==3.12.13"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
